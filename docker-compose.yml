services:
  app:
    build: .
    container_name: stock_screening
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./exports:/app/exports
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
